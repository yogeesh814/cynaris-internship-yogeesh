<!doctype html>
<html>
  <head>
    <title>HTML5 Sematic Elements</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f6f8;
        color: #333;
      }
      header {
        background-color: #81aad2;
        color: white;
        text-align: center;
        padding: 25px;
      }
      header h1 {
        margin: 0;
      }
      nav {
        background-color: #719cc7;
        text-align: center;
        padding: 15px;
      }
      nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
        font-weight: bold;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
      }
      section {
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      article {
        margin-top: 20px;
        padding: 20px;
        border-left: 4px solid #3498db;
        background-color: #f8f9fa;
      }
      h2 {
        color: #040f1a;
      }
      h3 {
        color: #02080d;
      }
      footer {
        background-color: #364565;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 40px;
      }
      footer p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HTML5 Semantic Elements</h1>
    </header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <main>
      <section>
        <h2>Semantic HTML5</h2>
        <article>
          <h3>About Semantic Elements</h3>
    <p>
        HTML5 relies on semantic elements to give 
        meaning to web page content, making it accessible and easy for search engines to read.
    </p>
    
        </article>
      </section>
    </main>
    <footer>
      <p>&copy;Developed by Yogeesh</p>
    </footer>
  </body>
</html>
